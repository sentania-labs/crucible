# Lint, unit, integration, and a compose smoke on GitHub-hosted runners: the
# integration tier needs a Docker daemon and the repository is public (github-ci skill).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - name: run the shared lint, including the image manifest check
        run: make lint

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: scan the tracked tree
        run: make scan-tree
      - name: scan the commits that just landed
        if: github.event_name == 'push'
        run: make scan-history SCAN_RANGE="${{ github.event.before }}..${{ github.sha }}"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - run: make test

  # The end-to-end tier (18) on the runner's own rootful daemon. The local run is on
  # the dedicated rootless daemon (13, S9); this is the same tier, same targets, on the
  # arrangement CI has.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - name: build the script-harness worker image
        run: make e2e-image
      - run: make e2e
      - name: what the daemon was left holding, on failure
        if: failure()
        run: |
          docker ps -a --filter label=crucible.attempt
          docker network ls

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: classify release candidate and supporting images
        run: make release-images-classify
      - name: make up from a clean clone
        run: make up
      # tools/smoke/compose_smoke.py is the only definition of this smoke; the
      # release workflow runs the same file against the image it is about to
      # publish, so a task contract change that breaks the release breaks the
      # pull request first.
      - name: the shared compose smoke
        run: make smoke
      - name: logs on failure
        if: failure()
        run: docker compose logs
      - name: down
        if: always()
        run: make down
