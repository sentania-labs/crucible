# Example Crucible configuration. All paths are illustrative.
[service]
bind = "0.0.0.0:8080"
render_timezone = "UTC"            # operators set their own zone in private configuration
artifact_root = "/var/lib/crucible/artifacts"

[database]
url = "postgresql+psycopg://crucible:CHANGE_ME@postgres:5432/crucible"

[docker]
endpoint = "tcp://docker-socket-proxy:2375"   # proxy in front of a dedicated rootless daemon where available
worker_network = "crucible-workers"
image_allowlist = ["crucible-worker:*", "ghcr.io/example-org/crucible-worker:*"]

[supervisor]
tick_seconds = 5
lease_ttl_seconds = 30
reconcile_interval_seconds = 60

[skills]
root = "/var/lib/crucible/skills"     # only skills a contract names are copied into a bundle

[egress]
proxy = "http://egress-proxy:3128"

[github]
poll_interval_seconds = 120           # polling is complete on its own; webhooks accelerate it
webhook_enabled = false               # true only when GitHub can reach /v1/github/webhook

[github.app]
app_id = 0                            # public identifier, not a secret
private_key_path = "/var/lib/crucible/credentials/github/app.pem"        # mounted read-only into crucible only
webhook_secret_path = "/var/lib/crucible/credentials/github/webhook.secret"

[credentials.claude_code]
source = "directory"
path = "/var/lib/crucible/credentials/claude_code"
mount_mode = "rw-narrow"

[credentials.codex]
source = "directory"
path = "/var/lib/crucible/credentials/codex"
mount_mode = "rw-narrow"

[credentials.agy]
source = "directory"
path = "/var/lib/crucible/credentials/agy"
mount_mode = "ro"

[wake.foundry]
mode = "poll"          # or "webhook"
webhook_url = ""
