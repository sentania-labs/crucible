# Example Crucible configuration. All paths are illustrative.
[service]
bind = "0.0.0.0:8080"
render_timezone = "UTC"            # operators set their own zone in private configuration
artifact_root = "/var/lib/crucible/artifacts"

[database]
url = "postgresql+psycopg://crucible:CHANGE_ME@postgres:5432/crucible"

# The Docker execution provider (08, 13). Every key here is read as
# CRUCIBLE_DOCKER__<NAME> from the environment as well; compose sets them that way.
[docker]
enabled = true
# The socket proxy in front of the dedicated rootless daemon (ADR 0004, S9).
# Crucible never sees the raw socket.
host = "tcp://docker-socket-proxy:2375"
api_timeout_seconds = 30

# How the artifact root appears to the daemon. `volume` is the normal-mode shape: the
# service runs as uid 1000 and shares one named volume with every container it creates,
# so workspaces, identity renders, report dirs and collector output have one owner and
# no chown step exists anywhere (S9 Test E). Developer mode uses `bind` with the
# daemon-visible path of the artifact root.
mount_kind = "volume"
artifact_volume = "crucible_crucible-artifacts"
# artifact_host_root = "/var/tmp/crucible-artifacts"   # developer mode only

workers_network = "crucible-workers"
egress_proxy = "http://egress-proxy:3128"
# What the egress proxy is configured to permit. An attempt whose allowlist (the union
# of the policy's egress_allowlist and the adapter's declared endpoints, S6) is not a
# subset of this is refused at launch rather than left to fail quietly on the network.
egress_allowlist = [
    "github.com",
    "objects.githubusercontent.com",
    "pypi.org",
    "files.pythonhosted.org",
    "registry.npmjs.org",
    "api.anthropic.com",
    "api.openai.com",
    "auth.openai.com",
    "chatgpt.com",
    "daily-cloudcode-pa.googleapis.com",
    "oauth2.googleapis.com",
]
no_proxy = "localhost,127.0.0.1"

# The credential root. One directory per harness; a worker is given its own and never
# another's (12), which the isolation test asserts.
credential_root = "/var/lib/crucible/credentials"

collector_timeout_seconds = 900
verifier_timeout_seconds = 3600
report_size_cap_bytes = 10485760      # the collector refuses to copy a larger file out
use_reference_cache = true            # a bare mirror to clone from with --dissociate
max_concurrency = 3                   # 05b concurrency.per_provider
# extra_image_allowlist = ["crucible-worker:script-harness-*"]   # the e2e image (18)

[supervisor]
tick_seconds = 5
lease_ttl_seconds = 30
reconcile_interval_seconds = 60
attempt_lease_ttl_seconds = 60
checkout_lease_ttl_seconds = 21600    # one attempt per repository url and work branch (10)
grace_seconds = 60                    # drain before kill (05b limits.grace_seconds)

[skills]
root = "/var/lib/crucible/skills"     # only skills a contract names are copied into a bundle

# The egress proxy's own configuration is generated by `make proxy-config` from the
# policy's allowlist and mounted into the proxy container; the hostnames Crucible
# believes it permits are [docker].egress_allowlist above, and the two must agree.

# GitHub delivery (12, 23). Nothing here is a secret: `private_key_path` and
# `webhook_secret_path` are paths to files Crucible reads, and the App id is a public
# identifier. Installation tokens are minted per job, live in memory and in the
# publisher container's tmpfs, and are never in configuration, env, logs, events, or
# the database.
[github]
enabled = true                        # false leaves the whole delivery half inert
api_base = "https://api.github.com"
api_timeout_seconds = 20
poll_interval_seconds = 120           # polling is complete on its own; webhooks accelerate it
reactions_poll_interval_seconds = 60  # reviewer pickup reaction is transient; completion +1 is durable
webhook_enabled = false               # true only when GitHub can reach /v1/github/webhook
credential_host = "github.com"        # the only host the publisher's credential helper answers for
publisher_timeout_seconds = 600       # a publisher that outlives this is failed, token and all (S10)
ci_log_excerpt_bytes = 65536          # what a CI failure record keeps of the run log
# publisher_image = "crucible-worker:script-harness-1.0.0-6a2bee03d6f1"  # default: the attempt's image
# 23 step 3: the publisher's own egress network, with an allowlist of github.com and
# api.github.com and nothing else. Deliberately not the workers' network, whose proxy
# permits every model endpoint a harness needs.
publisher_network = "crucible-publish"
publisher_egress_proxy = "http://publish-proxy:3128"
allow_issue_comments = false          # 23: the external-review trigger is the orchestrator's act

[github.app]
app_id = 0                            # public identifier, not a secret
private_key_path = "/var/lib/crucible/credentials/github/app.pem"        # mounted read-only into crucible only
webhook_secret_path = "/var/lib/crucible/credentials/github/webhook.secret"

# Harness credentials (12, 25). Each entry names a directory Crucible reads and seeds a
# per-attempt copy from; only the named auth files are copied, the copy is owned by the
# worker's uid, and it is removed right after the run. `mount_mode` may raise the
# adapter's declared minimum to `rw-narrow` and never lowers it (25 step 7). The values
# in these directories are never configuration and never appear in any record.
[credentials.claude_code]
source = "directory"
path = "/var/lib/crucible/credentials/claude_code"    # oauth-token (long-lived, S1b) and .claude.json
mount_mode = "rw-narrow"

[credentials.codex]
source = "directory"
path = "/var/lib/crucible/credentials/codex"          # auth.json; the CLI writes session state beside it (S1)
mount_mode = "rw-narrow"

[credentials.agy]
source = "directory"
path = "/var/lib/crucible/credentials/agy"            # .gemini/antigravity-cli/antigravity-oauth-token
mount_mode = "ro"      # the adapter's minimum; see c5.md for what the live run observed

# Harness enablement (25, S1b). A launch needs this gate and the administrator's runtime
# flag (`crucible-admin harnesses enable`, C5b; seeded the same way by migration 0008).
# A harness ships disabled until its dedicated Crucible session has refreshed on the
# Crucible side and the operator's own session was confirmed valid afterwards (S1b
# steps 5 and 6). Claude Code's long-lived token has no refresh, so it is verified.
[harnesses.claude_code]
enabled = true
reason = "session_compatibility verified (S1b)"

[harnesses.codex]
enabled = false
reason = "unverified: the dedicated session's Crucible-side refresh has not been observed and the operator's session confirmed after it (S1b steps 5 and 6)"

[harnesses.agy]
enabled = false
reason = "unverified: the dedicated session's Crucible-side refresh has not been observed and the operator's session confirmed after it (S1b steps 5 and 6)"

[wake.foundry]
mode = "poll"          # or "webhook"
webhook_url = ""
