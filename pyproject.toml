[project]
name = "crucible"
dynamic = ["version"]
description = "A deterministic supervisor for AI coding workers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "cryptography>=45.0",
    "fastapi>=0.116",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.35",
]

[project.scripts]
crucible = "crucible.cli.main:main"
crucible-admin = "crucible.cli.main:admin_shim"

[dependency-groups]
# Mirrors [build-system].requires so uv.lock hashes and pins the build backend too
# (113): uv only locks [project].dependencies and dependency-groups, so without this
# group hatchling and hatch-vcs would be resolved from the index unhashed at image
# build time, and a new release of either could change or break the image the way
# uvicorn 0.54.0 broke the worker image. The Dockerfile installs this group with
# `uv sync --frozen --group build-backend` before building the project.
build-backend = ["hatchling>=1.27", "hatch-vcs>=0.4"]
dev = [
    "httpx>=0.28",
    "import-linter>=2.3",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "testcontainers[postgres]>=4.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# The version comes from the git tag, never from a checked-in constant, so a
# release needs a tag and not a version-bump commit (sdlc skill). A build with
# no tag in reach reports a dev version; a build with no git at all (the
# Docker image) gets the version from the VERSION build arg the Dockerfile takes.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["crucible"]

[tool.hatch.build]
artifacts = ["crucible/adapters/ui/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF", "SIM", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLR0914"]

[tool.ruff.lint.per-file-ignores]
"crucible/adapters/persistence/migrations/versions/*" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^build/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a PostgreSQL container",
    "e2e: needs a Docker daemon, the proxies, and the script-harness worker image (18)",
    "e2e_github: the live GitHub tier (23): the App key, a throwaway repository, local only",
    "e2e_live: the live harness tier (07, 18): real harness images with the dedicated credentials, local only",
    "e2e_registry: the real crane against a stub registry that redirects its blobs (108)",
    "e2e_admin: the live administration tier (25): every operation through the API and the CLI, probes with the dedicated credentials, local only",
    "e2e_command_timeout: each real harness in the worker image against a stub model, no network and no login (issue 128)",
]
filterwarnings = ["error::DeprecationWarning:crucible.*"]

[tool.importlinter]
root_package = "crucible"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward only"
type = "layers"
layers = [
    "crucible.cli",
    "crucible.adapters | crucible.scheduler | crucible.client",
    "crucible.application",
    "crucible.ports",
    "crucible.contracts",
    "crucible.domain",
]

[[tool.importlinter.contracts]]
name = "The domain is pure Python"
type = "forbidden"
source_modules = ["crucible.domain"]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "alembic", "psycopg", "pydantic",
    "pydantic_settings", "uvicorn", "yaml", "docker",
    "crucible.settings", "crucible.logs", "crucible.contracts", "crucible.ports",
    "crucible.application", "crucible.adapters", "crucible.scheduler", "crucible.cli",
]

[[tool.importlinter.contracts]]
name = "The client library speaks HTTP and nothing else of the server"
type = "forbidden"
source_modules = ["crucible.client"]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "alembic", "psycopg", "uvicorn", "docker",
    "crucible.settings", "crucible.logs", "crucible.ports", "crucible.application",
    "crucible.adapters", "crucible.scheduler", "crucible.cli",
]

[[tool.importlinter.contracts]]
name = "Contracts and ports know no framework beyond pydantic"
type = "forbidden"
source_modules = ["crucible.contracts", "crucible.ports", "crucible.application"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "alembic", "psycopg", "uvicorn"]
