# One account for both Deployments, bound to the Role in `crucible-workers` and to
# nothing else (see ../workers/rolebinding.yaml). No permission in this namespace, none
# cluster-wide.
#
# 26 calls this "the supervisor's ServiceAccount" and the supervisor is what creates
# attempt objects with it. The api Deployment uses the same account because the admin
# status page (25) reports provider health, and the Kubernetes provider answers that by
# running the namespace readiness canary: the api process makes real API calls to
# `crucible-workers` on every status read, so a second, weaker account would only mean a
# status page that says the cluster is broken when it is not.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crucible-supervisor
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: control-plane
