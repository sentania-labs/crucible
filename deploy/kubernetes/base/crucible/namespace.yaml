# Crucible's own namespace (01, 26): the api and supervisor Deployments, PostgreSQL, and
# the only place the GitHub App key and webhook secret are ever mounted (12). Pod
# Security admission is `baseline` here rather than `restricted`: these are Crucible's
# own trusted pods, and the PostgreSQL image's entrypoint needs to start as root before
# it drops. The untrusted half of the system is `crucible-workers`, which is
# `restricted`.
apiVersion: v1
kind: Namespace
metadata:
  name: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: control-plane
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
