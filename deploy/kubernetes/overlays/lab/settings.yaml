# REPLACE: REPLACE_ME_CLUSTER_DNS_IP     `kubectl -n kube-system get svc kube-dns`
# REPLACE: REPLACE_ME_PROBE_IMAGE        the promoted worker image, exact tag (26)
# REPLACE: REPLACE_ME_RENDER_TIMEZONE  the operator's zone, an IANA name (01)
#
# 26 checklist item 2 and the DNS denial: the provider allows port 53 on this one address
# and denies everything else inside the cluster. A wrong address is a worker with no name
# resolution; it is never a worker with more reach.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crucible-settings
  namespace: crucible
data:
  CRUCIBLE_KUBERNETES__CLUSTER_DNS_IP: REPLACE_ME_CLUSTER_DNS_IP
  CRUCIBLE_SERVICE__RENDER_TIMEZONE: REPLACE_ME_RENDER_TIMEZONE
  CRUCIBLE_KUBERNETES__STORAGE_CLASS: REPLACE_ME_STORAGE_CLASS_RWO
  CRUCIBLE_KUBERNETES__IMAGE_PULL_SECRET: REPLACE_ME_IMAGE_PULL_SECRET
  CRUCIBLE_KUBERNETES__PROBE_IMAGE: REPLACE_ME_PROBE_IMAGE
