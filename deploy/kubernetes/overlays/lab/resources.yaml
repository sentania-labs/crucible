# REPLACE: the numbers below, if the lab's sizing differs.
#
# How many attempts run at once is `CRUCIBLE_KUBERNETES__MAX_CONCURRENCY` in
# settings.yaml, not this object: see ../../base/workers/resourcequota.yaml for why no
# Job or Pod count appears here. This is the ceiling those attempts share, and the claim
# count is the structural cap, one claim per attempt.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: crucible-workers
  namespace: crucible-workers
spec:
  hard:
    persistentvolumeclaims: "24"
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "12"
    limits.memory: 24Gi
