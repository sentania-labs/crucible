# The replacement for Foundry's tools/foundry-crucible: the same `foundry-crucible`
# command, now a shim over `crucible` (docs/client.md). Foundry copies this directory
# over tools/foundry-crucible; nothing here is built or installed by Crucible itself.
[project]
name = "foundry-crucible"
version = "0.2.0"
description = "Deprecated: runs `crucible` with the same arguments"
requires-python = ">=3.12,<3.13"
# Pin to the Crucible release that carries `crucible` with the orchestrator verbs.
dependencies = ["crucible @ git+https://github.com/sentania-labs/crucible@main"]

[project.scripts]
foundry-crucible = "foundry_crucible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry_crucible"]
