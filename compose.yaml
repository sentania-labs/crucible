# Crucible local operation (13). Normal mode: `make up`. Developer mode: `make dev`
# (postgres, the socket proxy and the egress proxy) with `uv run crucible serve --all`
# on the host.
#
# This project runs on the dedicated rootless daemon of the `crucible` service user
# (S9, ADR 0004). Point your own docker at it before running compose:
#
#   export DOCKER_HOST=unix:///run/user/$(id -u crucible)/docker.sock
#
# `make up` does that for you. Workers, collectors, verifiers and preparers are not
# services here: Crucible creates them through the socket proxy on the
# `crucible-workers` network, so `docker compose down` leaves a running worker alone
# by design.
name: crucible

services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_USER: crucible
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: crucible
    volumes:
      - crucible-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crucible -d crucible"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The only container that ever mounts the Docker socket (13, ADR 0004). It narrows
  # the API surface; it cannot refuse a create body that asks for Privileged, which is
  # what the create-request policy in Crucible is for. S9: with this image EXEC=0
  # still lets POST /containers/{id}/exec create an exec instance, but /exec/{id}/start
  # is refused, so no command can run.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SYSTEM: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      INFO: 0
      LOG_LEVEL: warning
    volumes:
      # The rootless daemon's socket. `make up` fills CRUCIBLE_DOCKER_SOCKET in from
      # `id -u crucible`; never hardcode 999, it differs per host (S9).
      - ${CRUCIBLE_DOCKER_SOCKET:-/run/user/999/docker.sock}:/var/run/docker.sock:ro
    networks:
      - default

  # The workers' only way out (13). squid cannot open /dev/stdout as the unprivileged
  # `proxy` user (S9), but this image's entrypoint tails the access log into the
  # container log, so `docker compose logs egress-proxy` carries every CONNECT and
  # every refusal. The allowlist is generated by `make proxies` from the policy.
  egress-proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    volumes:
      - ./var/egress/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - crucible-workers

  migrate:
    # Checked-in defaults track `latest`; a deployment pins an exact tag and that
    # pin lives in the deployment repo, not here (sdlc skill).
    # Use `make up`: it passes --build, so your working tree is what runs. A bare
    # `docker compose up` pulls the published `latest` when one exists and only
    # builds if the pull fails, which is not what you want while developing.
    # CRUCIBLE_IMAGE lets the release workflow boot one exact, locally built
    # candidate instead of whatever `latest` currently resolves to.
    image: ${CRUCIBLE_IMAGE:-ghcr.io/sentania-labs/crucible:latest}
    build: .
    profiles: ["full"]
    command: ["crucible-admin", "migrate"]
    environment:
      CRUCIBLE_DATABASE__URL: postgresql+psycopg://crucible:${POSTGRES_PASSWORD}@postgres:5432/crucible
    depends_on:
      postgres:
        condition: service_healthy

  crucible:
    # Tracks `latest`; deployments pin an exact tag (see migrate above).
    image: ${CRUCIBLE_IMAGE:-ghcr.io/sentania-labs/crucible:latest}
    build: .
    profiles: ["full"]
    restart: unless-stopped
    command: ["crucible", "serve", "--all"]
    environment:
      CRUCIBLE_DATABASE__URL: postgresql+psycopg://crucible:${POSTGRES_PASSWORD}@postgres:5432/crucible
      CRUCIBLE_SERVICE__BIND: 0.0.0.0:8080
      CRUCIBLE_SERVICE__RENDER_TIMEZONE: UTC
      CRUCIBLE_SUPERVISOR__HOLDER: crucible-compose
      # The Docker provider (08, 13). S9 Test E: the service runs as uid 1000 and the
      # artifact root is a named volume it shares with every container it creates, so
      # workspaces, identity renders, report dirs and collector output have one owner
      # and no chown step is needed anywhere.
      CRUCIBLE_DOCKER__ENABLED: "true"
      CRUCIBLE_DOCKER__HOST: tcp://docker-socket-proxy:2375
      CRUCIBLE_DOCKER__MOUNT_KIND: volume
      CRUCIBLE_DOCKER__ARTIFACT_VOLUME: crucible_crucible-artifacts
      CRUCIBLE_DOCKER__WORKERS_NETWORK: crucible-workers
      CRUCIBLE_DOCKER__EGRESS_PROXY: http://egress-proxy:3128
      CRUCIBLE_DOCKER__EGRESS_ALLOWLIST: ${CRUCIBLE_EGRESS_ALLOWLIST:-github.com,objects.githubusercontent.com,pypi.org,files.pythonhosted.org,registry.npmjs.org}
    volumes:
      - crucible-artifacts:/var/lib/crucible/artifacts
    ports:
      - "127.0.0.1:${CRUCIBLE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/v1/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      # The only container that ever mounts the Docker socket (13, ADR 0004). It narrows
  # the API surface; it cannot refuse a create body that asks for Privileged, which is
  # what the create-request policy in Crucible is for. S9: with this image EXEC=0
  # still lets POST /containers/{id}/exec create an exec instance, but /exec/{id}/start
  # is refused, so no command can run.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SYSTEM: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      INFO: 0
      LOG_LEVEL: warning
    volumes:
      # The rootless daemon's socket. `make up` fills CRUCIBLE_DOCKER_SOCKET in from
      # `id -u crucible`; never hardcode 999, it differs per host (S9).
      - ${CRUCIBLE_DOCKER_SOCKET:-/run/user/999/docker.sock}:/var/run/docker.sock:ro
    networks:
      - default

  # The workers' only way out (13). squid cannot open /dev/stdout as the unprivileged
  # `proxy` user (S9), but this image's entrypoint tails the access log into the
  # container log, so `docker compose logs egress-proxy` carries every CONNECT and
  # every refusal. The allowlist is generated by `make proxies` from the policy.
  egress-proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    volumes:
      - ./var/egress/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - crucible-workers

  migrate:
        condition: service_completed_successfully

networks:
  default:
  # internal: no default route, no resolver, and no reach to postgres, crucible or the
  # socket proxy (13, S4). The egress proxy sits on both sides and is the only way out.
  crucible-workers:
    name: crucible-workers
    internal: true
    # Declared so the egress proxy's source ACL can name it; the generated squid
    # configuration and this must agree (see WORKERS_SUBNET in the Makefile).
    ipam:
      config:
        - subnet: ${CRUCIBLE_WORKERS_SUBNET:-10.88.0.0/24}

volumes:
  crucible-pg:
  crucible-artifacts:
